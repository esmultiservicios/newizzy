---
# IZZY - cPanel Git Deployment
#
# Este repositorio ya está ubicado directamente en el Document Root de IZZY:
# /home/esmultiservicios/public_html/demo.izzycloud.app
#
# Por seguridad NO se copia el repositorio sobre sí mismo y NO se utilizan
# comodines que puedan copiar .git u otros archivos internos. El deployment
# valida que el Document Root y el punto de entrada existan.
deployment:
  tasks:
    - export DEPLOYPATH=/home/esmultiservicios/public_html/demo.izzycloud.app/
    - /usr/bin/test -d "$DEPLOYPATH"
    - /usr/bin/test -f "$DEPLOYPATH/index.php"
